<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبر حالك: قديش إنت أردني؟</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F2F0;--surface:#FFFFFF;--ink:#16191A;--muted:#5B6560;--line:#D5DAD6;
  --green:#00793B;--red:#C8102E;--green-soft:#DDF1E5;--red-soft:#F9DDE2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101311;--surface:#1B201D;--ink:#EEF2EF;--muted:#9AA6A0;--line:#343C37;--green:#2FB866;--red:#E8445E;--green-soft:#173625;--red-soft:#3C1A21;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#101311;--surface:#1B201D;--ink:#EEF2EF;--muted:#9AA6A0;--line:#343C37;--green:#2FB866;--red:#E8445E;--green-soft:#173625;--red-soft:#3C1A21;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--green);outline-offset:3px}

/* the flag hero */
.flag{position:relative;display:grid;grid-template-rows:1fr 1.7fr 1fr;min-height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.flag .b{background:#16191A}
.flag .w{background:#fff;color:#16191A;display:flex;flex-direction:column;justify-content:center;padding:6px 20px 6px 34%}
.flag .g{background:#00793B}
.flag .tri{position:absolute;inset:0 auto 0 0;width:38%;background:#C8102E;clip-path:polygon(0 0,100% 50%,0 100%)}
.flag h1{margin:0;font-size:clamp(1.45rem,6.4vw,2.3rem);line-height:1.25;font-weight:700}
.flag p{margin:4px 0 0;font-size:.95rem;color:#4a524e}
.intro{margin:22px 0 18px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.tags li{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 14px;font-size:.9rem}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 20px;font-weight:600;font-size:1.05rem;background:var(--green);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:10px}
.btn:active{transform:scale(.99)}

/* quiz */
.hidden{display:none!important}
.steps{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-bottom:8px}
.steps i{height:8px;border-radius:2px;background:var(--line)}
.steps i.ok{background:var(--green)}.steps i.no{background:var(--red)}.steps i.cur{background:var(--ink)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:16px}
.q{font-size:clamp(1.25rem,5vw,1.6rem);font-weight:600;line-height:1.45;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 16px;font-size:1.05rem;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--green)}
.fb.bad{border-inline-start-color:var(--red)}
.fb b{display:block;margin-bottom:2px}
.fb + .btn{margin-top:14px}

/* result */
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:center}
.res .bar{height:14px;background:linear-gradient(#16191A 0 33.3%,#fff 33.3% 66.6%,#00793B 66.6%)}
.res .in{padding:26px 20px 24px}
.score{font-size:3.4rem;font-weight:700;line-height:1;color:var(--green)}
.score small{font-size:1.1rem;color:var(--muted);font-weight:400}
.res h2{margin:14px 0 6px;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.25}
.res p{margin:0 auto;max-width:34ch;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:22px 0 0}
.cats div{border:1px solid var(--line);border-radius:10px;padding:8px}
.cats strong{display:block;font-size:1.25rem}
.cats span{font-size:.88rem;color:var(--muted)}
@media (max-width:380px){.flag .w{padding-left:30%}.cats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <section id="start">
    <div class="flag" role="img" aria-label="علم الأردن">
      <div class="b"></div>
      <div class="w"><h1>اختبر حالك: قديش إنت أردني؟</h1><p>١٢ سؤال، وبنعرف إنت منين</p></div>
      <div class="g"></div>
      <div class="tri"></div>
    </div>
    <p class="intro">أسئلة عن اللهجة والأكل والمدن والعادات. جاوب بسرعة وبدون ما تسأل حدا، وبآخر الاختبار بنحكيلك إنت أردني أصلي ولا لسه.</p>
    <ul class="tags"><li>اللهجة</li><li>الأكلات</li><li>المدن</li><li>العادات</li></ul>
    <button class="btn" id="go">ابدأ الاختبار</button>
  </section>

  <section id="quiz" class="hidden" aria-live="polite">
    <div class="steps" id="steps"></div>
    <div class="meta"><span id="cat"></span><span id="num"></span></div>
    <h2 class="q" id="q"></h2>
    <div class="opts" id="opts"></div>
    <div id="fb"></div>
    <button class="btn hidden" id="next">التالي</button>
  </section>

  <section id="result" class="hidden">
    <div class="res">
      <div class="bar"></div>
      <div class="in">
        <div class="score"><span id="sc"></span> <small>من ١٢</small></div>
        <h2 id="tier"></h2>
        <p id="desc"></p>
        <div class="cats" id="cats"></div>
      </div>
    </div>
    <button class="btn" id="share" style="margin-top:16px">شارك نتيجتك</button>
    <button class="btn alt" id="again">أعد الاختبار</button>
  </section>
</main>

<script>
// الجواب الصحيح دايماً أول خيار، والترتيب بيتخلط عند العرض
var Q=[
{c:"اللهجة",q:"لما حدا يقلك «هسا»، شو بقصد؟",o:["الآن","بعد شوي","مبارح","السنة الجاي"],e:"«هسا» يعني الآن، وبتسمعها بكل بيت أردني."},
{c:"اللهجة",q:"إذا قالك صاحبك «روح دغري»، شو بدو منك؟",o:["تروح على طول بدون لف","تروح من الطريق الطويلة","تستنى شوي","ترجع عالبيت"],e:"«دغري» يعني مباشرة وعلى طول."},
{c:"اللهجة",q:"لما الأم تقول لابنها «تقبرني»، شو بتقصد؟",o:["كلمة حب وتدليل","بتدعي عليه","بتشكره رسمياً","بتطلب منه يطلع"],e:"أغلى كلمة حب عند الأمهات، وما إلها علاقة بالدعاء السيئ."},
{c:"الأكلات",q:"شو الأكلة الوطنية الأردنية؟",o:["المنسف","المقلوبة","الكبسة","الكشري"],e:"المنسف هو سيد الموائد، وبتتقدم بالأفراح والعزايم الكبيرة."},
{c:"الأكلات",q:"شو بنستعمل بالمنسف الأصلي بدل الحليب العادي؟",o:["جميد الكرك","كريمة طبخ","لبنة","حليب جوز الهند"],e:"الجميد هو لبن الغنم المجفف، وهو سر نكهة المنسف."},
{c:"الأكلات",q:"شو فطور الجمعة الكلاسيكي عند الأردنيين؟",o:["فول وحمص وفلافل","كورن فليكس","كرواسون وجبنة","بان كيك"],e:"الجمعة بتبدأ من محل الحمص والفول، والطابور جزء من الطقس."},
{c:"المدن",q:"مدينة السلط مشهورة بإيش؟",o:["بيوتها الحجرية الصفراء القديمة","ناطحات السحاب","الشواطئ","مصانع السيارات"],e:"السلط مدينة التسامح والعمارة الحجرية، ومدرجة على لائحة اليونسكو للتراث العالمي."},
{c:"المدن",q:"أي مكان بتسموه «وادي القمر»؟",o:["وادي رم","وادي موسى","وادي الموجب","وادي السير"],e:"وادي رم بصخوره الحمرا ورماله بيشبه سطح القمر، وبتنام فيه تحت النجوم."},
{c:"المدن",q:"وين بتقدر تعوم وإنت مستلقي بدون ما تغرق؟",o:["البحر الميت","بحيرة طبريا","خليج العقبة","سد الوحدة"],e:"ملوحة البحر الميت العالية بتخليك تطفو، وهو أخفض نقطة على سطح الأرض."},
{c:"العادات",q:"أول شي بنقدمه للضيف لما يدخل البيت؟",o:["القهوة السادة","كولا","عصير جاهز","مي بارد وبس"],e:"القهوة السادة أول الضيافة، ورفضها بدون سبب بتعتبر شي غريب."},
{c:"العادات",q:"إذا شربت فنجان القهوة وما بدك زيادة، شو بتعمل؟",o:["بتهز الفنجان بإيدك","بتقلب الفنجان عالصحن","بتقول ما بدي","بتتركه ممتلي"],e:"هزة الفنجان هي طريقة بتقول فيها «كفاية، الله يعطيك العافية»."},
{c:"العادات",q:"شو معنى «الفزعة» عند الأردنيين؟",o:["تهب لمساعدة حدا بدون ما يطلب","حفلة عشا","لعبة شعبية","لباس تقليدي"],e:"الفزعة هي النخوة، تسمع بالمصيبة وتكون أول الواصلين."}
];
var T=[
{m:10,t:"أردني أصلي",d:"من ريحة الطابون وشاي الجمر. حدا بيحكيلك «هسا» وإنت ما بتسأل شو يعني. بتنفع تكون دليل سياحي لأي ضيف."},
{m:7,t:"أردني متوسط",d:"عارف الأساسيات وبتتفاهم، بس لسه ناقصك شوية. بتحتاج زيارة لبيت الجدة وصحن منسف على أصوله."},
{m:4,t:"أردني برا البلد",d:"قلبك أردني بس الغربة أخدت من لهجتك. رجعة على عمان بتصلحها، ولا تنسى تجيب معك جميد."},
{m:0,t:"ضيف جديد على الأردن",d:"أهلاً وسهلاً فيك، بيت الأردنيين مفتوح. ابدأ بفنجان قهوة سادة وخلي أي حدا يعلمك الباقي."}
];
var $=function(i){return document.getElementById(i)};
var i,score,res,qs,cats;
function show(id){["start","quiz","result"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function start(){i=0;score=0;res=[];qs=Q;cats={};show("quiz");render()}
function steps(){var h="";for(var k=0;k<12;k++){h+='<i class="'+(k<res.length?(res[k]?"ok":"no"):(k===i?"cur":""))+'"></i>'}$("steps").innerHTML=h}
function render(){
  var q=qs[i];steps();
  $("cat").textContent=q.c;$("num").textContent="السؤال "+(i+1)+" من 12";$("q").textContent=q.q;
  $("fb").innerHTML="";$("next").classList.add("hidden");
  $("next").textContent=i===11?"شوف نتيجتك":"التالي";
  var box=$("opts");box.innerHTML="";
  shuffle(q.o).forEach(function(t){
    var b=document.createElement("button");b.className="opt";b.type="button";b.textContent=t;
    b.onclick=function(){pick(b,t===q.o[0])};box.appendChild(b);
  });
}
function pick(btn,ok){
  var q=qs[i];
  Array.prototype.forEach.call($("opts").children,function(b){b.disabled=true;if(b.textContent===q.o[0])b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  res.push(ok);if(ok)score++;
  cats[q.c]=cats[q.c]||{r:0,n:0};cats[q.c].n++;if(ok)cats[q.c].r++;
  $("fb").innerHTML='<div class="fb'+(ok?"":" bad")+'"><b>'+(ok?"صح عليك!":"لا، مش هيك.")+"</b>"+q.e+"</div>";
  steps();$("next").classList.remove("hidden");$("next").focus({preventScroll:false});
}
function finish(){
  var t=T.filter(function(x){return score>=x.m})[0];
  $("sc").textContent=score;$("tier").textContent=t.t;$("desc").textContent=t.d;
  var h="";Object.keys(cats).forEach(function(k){h+="<div><strong>"+cats[k].r+" / "+cats[k].n+"</strong><span>"+k+"</span></div>"});
  $("cats").innerHTML=h;show("result");
}
$("go").onclick=start;
$("next").onclick=function(){if(i<11){i++;render()}else finish()};
$("again").onclick=start;
$("share").onclick=function(){
  var txt="جبت "+score+" من 12 باختبار «قديش إنت أردني؟» وطلعت: "+$("tier").textContent+". جرب إنت كمان!";
  try{
    if(navigator.share){navigator.share({text:txt}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){$("share").textContent="تم النسخ"})}
  }catch(e){}
};
</script>
</body>
</html>
